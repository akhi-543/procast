[package]
name = "akscast"
version = "0.1.0"
edition = "2024"
description = "Fast keyboard launcher for Windows"

[dependencies]
fend-core = "1.5"
futures = "0.3"
gpui-ce = "=0.3.0"
gpui_ce_elements = "=0.3.0"
gpui_ce_platform = "=0.3.0"
nucleo-matcher = "0.3"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tray-icon = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
debug = "line-tables-only"
